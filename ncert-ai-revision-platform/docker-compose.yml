services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: ./apps/api
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/ncert_ai
      JWT_SECRET: change-me-in-development
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:5173
      AI_PROVIDER: demo
      REDIS_URL: redis://redis:6379
    ports:
      - "5000:5000"
    depends_on:
      - mongo
      - redis

  web:
    build:
      context: ./apps/web
    environment:
      VITE_API_URL: http://localhost:5000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  mongo_data:
